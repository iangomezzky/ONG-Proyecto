<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Diagrama ER - Sistema ONG</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f4f4f9;
      margin: 0;
      padding: 20px;
      height: 100vh;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }
    h2 {
      margin-top: 0;
      font-size: 1.2rem;
      color: #000;
    }
    #erd-container {
      background: #fff;
      flex-grow: 1;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      overflow: hidden;
      position: relative;
    }
    .controls-hint {
      position: absolute;
      bottom: 15px;
      right: 15px;
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 12px;
      pointer-events: none;
      z-index: 10;
    }
    #erd {
      width: 100%;
      height: 100%;
    }

    /* Estilos de bordes y divisiones */
    #erd svg.erDiagram .divider path { stroke-opacity: 0.5; }
    #erd svg.erDiagram .row-rect-odd path,
    #erd svg.erDiagram .row-rect-odd rect,
    #erd svg.erDiagram .row-rect-even path,
    #erd svg.erDiagram .row-rect-even rect { stroke: none !important; }

    /* Regla estricta para forzar letra negra en todos los elementos del diagrama */
    #erd svg.erDiagram text,
    #erd svg.erDiagram text *,
    #erd svg.erDiagram .nodeText,
    #erd svg.erDiagram tspan,
    #erd svg.erDiagram .entityBox text {
      fill: #000000 !important;
      color: #000000 !important;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>
</head>
<body>

  <h2>Diagrama Entidad-Relación — Sistema Principal ONG</h2>
  <div id="erd-container">
    <div class="controls-hint">Usa la rueda del mouse para hacer ZOOM y arrastra para MOVER</div>
    <div id="erd">Cargando diagrama...</div>
  </div>

  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

    await document.fonts.ready;

    mermaid.initialize({
      startOnLoad: false,
      theme: 'base',
      fontFamily: 'sans-serif',
      themeVariables: {
        darkMode: false,
        fontSize: '13px',
        lineColor: '#73726c',
        textColor: '#000000',
        attributeFontColor: '#000000',
        entityTitleColor: '#000000'
      },
    });

    const def = `erDiagram
      PERSONA ||--o| USUARIO : "es_staff_(excluyente)"
      PERSONA ||--o| PERSONA_ASISTIDA : "es_asistida_(excluyente)"
      USUARIO ||--o| PROFESIONAL : "puede_ser"
      USUARIO ||--o{ USUARIO_DISPOSITIVO : accede_a
      DISPOSITIVO ||--o{ USUARIO_DISPOSITIVO : tiene
      ROL ||--o{ USUARIO_DISPOSITIVO : asigna
      TIPO_DISPOSITIVO ||--o{ DISPOSITIVO : clasifica
      PROFESIONAL ||--o{ PROFESIONAL_AREA : tiene_alcance_en
      AREA ||--o{ PROFESIONAL_AREA : otorga
      PERSONA_ASISTIDA ||--o{ ESTADIA : registra
      DISPOSITIVO ||--o{ ESTADIA : aloja
      DISPOSITIVO ||--o{ PARTE_DIARIO : genera
      PARTE_DIARIO ||--o{ REGISTRO_PRESENCIA : contiene
      PERSONA_ASISTIDA ||--o{ REGISTRO_PRESENCIA : participa
      PERSONA_ASISTIDA ||--o{ TRAYECTORIA : tiene
      PROFESIONAL ||--o{ TRAYECTORIA : interviene_en
      AREA ||--o{ TRAYECTORIA : clasifica_opcional
      DISPOSITIVO ||--o{ TRAYECTORIA : ocurre_en_opcional
      TIPO_INTERVENCION ||--o{ TRAYECTORIA : tipifica
      PERSONA_ASISTIDA ||--o| FICHA_EDUCACION : tiene
      PERSONA_ASISTIDA ||--o| FICHA_SALUD : tiene
      PERSONA_ASISTIDA ||--o| FICHA_ASISTENCIA_SOCIAL : tiene
      PROFESIONAL ||--o{ FICHA_SALUD : responsable_de
      USUARIO ||--o{ AUDITORIA : genera
      DISPOSITIVO ||--o{ DISPOSITIVO_AREA : habilita
      AREA ||--o{ DISPOSITIVO_AREA : aplica_en
      DISPOSITIVO_AREA ||--o{ TALLER : contexto_de
      TALLER ||--o{ INSCRIPCION_TALLER : recibe
      PERSONA_ASISTIDA ||--o{ INSCRIPCION_TALLER : se_inscribe
      TALLER ||--o{ TALLER_PROFESIONAL : dictado_por
      PROFESIONAL ||--o{ TALLER_PROFESIONAL : dicta
      TALLER ||--o{ SESION_TALLER : tiene
      SESION_TALLER ||--o{ ASISTENCIA_TALLER : registra
      PERSONA_ASISTIDA ||--o{ ASISTENCIA_TALLER : asiste

      PERSONA {
        int id_persona PK
        string dni UK
        string nombre
        string apellido
        date fecha_nacimiento
        string sexo
        string email
        string telefono
      }
      USUARIO {
        int id_usuario PK
        int id_persona FK, UK
        string nom_usuario UK
        string clave
        string estado
      }
      PROFESIONAL {
        int id_profesional PK
        int id_usuario FK, UK
        string matricula
        string especialidad
      }
      PERSONA_ASISTIDA {
        int id_asistida PK
        int id_persona FK, UK
        string estado
        string observaciones
      }
      TIPO_DISPOSITIVO {
        int id_tipo_dispositivo PK
        string nombre
        string descripcion
      }
      DISPOSITIVO {
        int id_dispositivo PK
        int id_tipo_dispositivo FK
        string nombre
        string direccion
        string telefono
        string email
        int capacidad
        string estado
      }
      USUARIO_DISPOSITIVO {
        int id_usuario PK, FK
        int id_dispositivo PK, FK
        int id_rol FK
      }
      ROL {
        int id_rol PK
        string nombre
        string descripcion
      }
      AREA {
        int id_area PK
        string nombre
        boolean activo
      }
      DISPOSITIVO_AREA {
        int id_dispositivo PK, FK
        int id_area PK, FK
        boolean activo
      }
      PROFESIONAL_AREA {
        int id_profesional PK, FK
        int id_area PK, FK
        boolean puede_leer
        boolean puede_escribir
      }
      ESTADIA {
        int id_estadia PK
        int id_asistida FK
        int id_dispositivo FK
        date fecha_ingreso
        date fecha_egreso
        string observacion
      }
      PARTE_DIARIO {
        int id_parte_diario PK
        int id_dispositivo FK
        date fecha
        string observacion_general
      }
      REGISTRO_PRESENCIA {
        int id_registro PK
        int id_parte_diario FK
        int id_asistida FK
        boolean asistio
        string hora_entrada
        string hora_salida
      }
      TIPO_INTERVENCION {
        int id_tipo_intervencion PK
        string nombre
      }
      TRAYECTORIA {
        int id_trayectoria PK
        int id_asistida FK
        int id_profesional FK
        int id_dispositivo FK
        int id_area FK
        int id_tipo_intervencion FK
        date fecha
        string sintesis
        string acuerdos
        string observaciones
        string proximos_pasos
      }
      FICHA_EDUCACION {
        int id_ficha_educacion PK
        int id_asistida FK, UK
        string institucion_educativa
        string nivel
        string curso
        string rendimiento
      }
      FICHA_SALUD {
        int id_ficha_salud PK
        int id_asistida FK, UK
        int id_profesional_responsable FK
        string tipo_atencion
        string indicaciones
      }
      FICHA_ASISTENCIA_SOCIAL {
        int id_ficha_asistencia PK
        int id_asistida FK, UK
        string situacion
        string tipo_asistencia
        string intervencion
      }
      AUDITORIA {
        int id_auditoria PK
        int id_usuario FK
        string accion
        string entidad
        int id_entidad
        string fecha
      }
      TALLER {
        int id_taller PK
        int id_dispositivo FK
        int id_area FK
        string nombre
        string dia_horario
        int cupo_maximo
        string estado
      }
      INSCRIPCION_TALLER {
        int id_asistida PK, FK
        int id_taller PK, FK
        date fecha_inscripcion
        string estado
      }
      TALLER_PROFESIONAL {
        int id_taller PK, FK
        int id_profesional PK, FK
      }
      SESION_TALLER {
        int id_sesion PK
        int id_taller FK
        date fecha
        string observacion
      }
      ASISTENCIA_TALLER {
        int id_sesion PK, FK
        int id_asistida PK, FK
        boolean presente
        string observacion
      }
    `;

    try {
      const { svg } = await mermaid.render('erd-svg', def);
      const container = document.getElementById('erd');
      container.innerHTML = svg;

      // Transformación de contenedores rectangulares con bordes redondeados (rx="8")
      document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
        const firstPath = node.querySelector('path[d]');
        if (!firstPath) return;
        const d = firstPath.getAttribute('d');
        const nums = d.match(/-?[\d.]+/g)?.map(Number);
        if (!nums || nums.length < 8) return;
        const xs = [nums[0], nums[2], nums[4], nums[6]];
        const ys = [nums[1], nums[3], nums[5], nums[7]];
        const x = Math.min(...xs), y = Math.min(...ys);
        const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
        const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        rect.setAttribute('x', x); rect.setAttribute('y', y);
        rect.setAttribute('width', w); rect.setAttribute('height', h);
        rect.setAttribute('rx', '8');
        for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
          if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
        }
        firstPath.replaceWith(rect);
      });

      document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
        p.setAttribute('stroke', 'none');
      });

      // Inicialización de Pan y Zoom
      const svgElement = container.querySelector('svg');
      if (svgElement) {
        svgElement.setAttribute('width', '100%');
        svgElement.setAttribute('height', '100%');
        svgPanZoom(svgElement, {
          zoomEnabled: true,
          controlIconsEnabled: true,
          maxZoom: 10,
          minZoom: 0.5,
          zoomScaleSensitivity: 0.3,
          mouseWheelZoomEnabled: true
        });
      }
    } catch (e) {
      document.getElementById('erd').innerHTML = `<p style="color:red; padding:10px;">Error al renderizar: ${e.message}</p>`;
      console.error(e);
    }
  </script>
</body>
</html>
