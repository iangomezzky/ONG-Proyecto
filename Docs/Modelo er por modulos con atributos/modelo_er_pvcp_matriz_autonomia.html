<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Diagrama ER - PVCP y Evaluación de Autonomía</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f4f4f9;
      margin: 0;
      padding: 20px;
      height: 100vh;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }
    h2 {
      margin-top: 0;
      font-size: 1.2rem;
      color: #000;
    }
    #erd-container {
      background: #fff;
      flex-grow: 1;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      overflow: hidden;
      position: relative;
    }
    .controls-hint {
      position: absolute;
      bottom: 15px;
      right: 15px;
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 12px;
      pointer-events: none;
      z-index: 10;
    }
    #erd {
      width: 100%;
      height: 100%;
    }

    /* Estilos de bordes y divisiones */
    #erd svg.erDiagram .divider path { stroke-opacity: 0.5; }
    #erd svg.erDiagram .row-rect-odd path,
    #erd svg.erDiagram .row-rect-odd rect,
    #erd svg.erDiagram .row-rect-even path,
    #erd svg.erDiagram .row-rect-even rect { stroke: none !important; }

    /* Forzado estricto de letra negra en todo el SVG */
    #erd svg.erDiagram text,
    #erd svg.erDiagram text *,
    #erd svg.erDiagram .nodeText,
    #erd svg.erDiagram tspan,
    #erd svg.erDiagram .entityBox text {
      fill: #000000 !important;
      color: #000000 !important;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>
</head>
<body>

  <h2>Diagrama Entidad-Relación — PVCP y Autonomía</h2>
  <div id="erd-container">
    <div class="controls-hint">Usa la rueda del mouse para hacer ZOOM y arrastra para MOVER</div>
    <div id="erd">Cargando diagrama...</div>
  </div>

  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

    await document.fonts.ready;

    mermaid.initialize({
      startOnLoad: false,
      theme: 'base',
      fontFamily: 'sans-serif',
      themeVariables: {
        darkMode: false,
        fontSize: '13px',
        lineColor: '#73726c',
        textColor: '#000000',
        attributeFontColor: '#000000',
        entityTitleColor: '#000000'
      },
    });

    const def = `erDiagram
      PERSONA_ASISTIDA ||--o| PVCP : tiene
      PVCP ||--o{ OBJETIVO_PVCP : contiene
      AREA ||--o{ OBJETIVO_PVCP : clasifica_opcional
      OBJETIVO_PVCP ||--o{ ACCION_PVCP : define
      PROFESIONAL ||--o{ ACCION_PVCP : acompana
      OBJETIVO_PVCP ||--o{ SEGUIMIENTO_PVCP : evoluciona_en
      PROFESIONAL ||--o{ SEGUIMIENTO_PVCP : registra
      AREA ||--o{ ASPECTO_EVALUACION : agrupa
      ASPECTO_EVALUACION ||--o{ EVALUACION_AUTONOMIA : evalua
      PERSONA_ASISTIDA ||--o{ EVALUACION_AUTONOMIA : tiene
      NIVEL_AUTONOMIA ||--o{ EVALUACION_AUTONOMIA : clasifica
      PROFESIONAL ||--o{ EVALUACION_AUTONOMIA : responsable_de

      PERSONA_ASISTIDA {
        int id_asistida PK
      }
      PROFESIONAL {
        int id_profesional PK
      }
      AREA {
        int id_area PK
        string nombre
      }
      PVCP {
        int id_pvcp PK
        int id_asistida FK, UK
        date fecha_creacion
        string estado
      }
      OBJETIVO_PVCP {
        int id_objetivo PK
        int id_pvcp FK
        int id_area FK
        string descripcion
        string plazo
        date fecha_creacion
        string estado
      }
      ACCION_PVCP {
        int id_accion PK
        int id_objetivo FK
        string descripcion
        int id_profesional FK
        date fecha_inicio
        date fecha_fin_estimada
        string indicador_exito
        string estado
      }
      SEGUIMIENTO_PVCP {
        int id_seguimiento_pvcp PK
        int id_objetivo FK
        int id_profesional FK
        date fecha
        string avances
        string obstaculos
        string reformulacion
      }
      ASPECTO_EVALUACION {
        int id_aspecto PK
        int id_area FK
        string nombre
      }
      NIVEL_AUTONOMIA {
        int id_nivel PK
        string nombre
        int orden
      }
      EVALUACION_AUTONOMIA {
        int id_evaluacion PK
        int id_asistida FK
        int id_aspecto FK
        int id_nivel FK
        int id_profesional FK
        date fecha_revision
        string situacion_actual
        string necesidades
        string acciones_posibles
        string apoyos_necesarios
        string indicador_avance
      }
    `;

    try {
      const { svg } = await mermaid.render('erd-svg', def);
      const container = document.getElementById('erd');
      container.innerHTML = svg;

      // Transformación de nodos para aplicar bordes redondeados (rx="8")
      document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
        const firstPath = node.querySelector('path[d]');
        if (!firstPath) return;
        const d = firstPath.getAttribute('d');
        const nums = d.match(/-?[\d.]+/g)?.map(Number);
        if (!nums || nums.length < 8) return;
        const xs = [nums[0], nums[2], nums[4], nums[6]];
        const ys = [nums[1], nums[3], nums[5], nums[7]];
        const x = Math.min(...xs), y = Math.min(...ys);
        const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
        const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        rect.setAttribute('x', x); rect.setAttribute('y', y);
        rect.setAttribute('width', w); rect.setAttribute('height', h);
        rect.setAttribute('rx', '8');
        for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
          if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
        }
        firstPath.replaceWith(rect);
      });

      document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
        p.setAttribute('stroke', 'none');
      });

      // Inicialización de Pan y Zoom
      const svgElement = container.querySelector('svg');
      if (svgElement) {
        svgElement.setAttribute('width', '100%');
        svgElement.setAttribute('height', '100%');
        svgPanZoom(svgElement, {
          zoomEnabled: true,
          controlIconsEnabled: true,
          maxZoom: 10,
          minZoom: 0.5,
          zoomScaleSensitivity: 0.3,
          mouseWheelZoomEnabled: true
        });
      }
    } catch (e) {
      document.getElementById('erd').innerHTML = `<p style="color:red; padding:10px;">Error al renderizar: ${e.message}</p>`;
      console.error(e);
    }
  </script>
</body>
</html>
