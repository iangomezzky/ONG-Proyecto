<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Diagrama ER General Unificado</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f4f4f9;
      margin: 0;
      padding: 20px;
      height: 100vh;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }
    h2 {
      margin-top: 0;
      font-size: 1.2rem;
      color: #000;
    }
    #erd-container {
      background: #fff;
      flex-grow: 1;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      overflow: hidden;
      position: relative;
    }
    .controls-hint {
      position: absolute;
      bottom: 15px;
      right: 15px;
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 12px;
      pointer-events: none;
      z-index: 10;
    }
    #erd {
      width: 100%;
      height: 100%;
    }

    /* Estilos de bordes y divisiones */
    #erd svg.erDiagram .divider path { stroke-opacity: 0.5; }
    #erd svg.erDiagram .row-rect-odd path,
    #erd svg.erDiagram .row-rect-odd rect,
    #erd svg.erDiagram .row-rect-even path,
    #erd svg.erDiagram .row-rect-even rect { stroke: none !important; }

    /* Forzado estricto de letra negra en todo el SVG */
    #erd svg.erDiagram text,
    #erd svg.erDiagram text *,
    #erd svg.erDiagram .nodeText,
    #erd svg.erDiagram tspan,
    #erd svg.erDiagram .entityBox text {
      fill: #000000 !important;
      color: #000000 !important;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>
</head>
<body>

  <h2>Diagrama Entidad-Relación — Esquema Unificado Completo</h2>
  <div id="erd-container">
    <div class="controls-hint">Usa la rueda del mouse para hacer ZOOM y arrastra para MOVER</div>
    <div id="erd">Cargando diagrama...</div>
  </div>

  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

    await document.fonts.ready;

    mermaid.initialize({
      startOnLoad: false,
      theme: 'base',
      fontFamily: 'sans-serif',
      themeVariables: {
        darkMode: false,
        fontSize: '12px',
        lineColor: '#73726c',
        textColor: '#000000',
        attributeFontColor: '#000000',
        entityTitleColor: '#000000'
      },
    });

    const def = `erDiagram
      PERSONA ||--o| USUARIO : es_staff
      PERSONA ||--o| PERSONA_ASISTIDA : es_asistida
      USUARIO ||--o| PROFESIONAL : puede_ser
      USUARIO ||--o{ USUARIO_DISPOSITIVO : accede_a
      DISPOSITIVO ||--o{ USUARIO_DISPOSITIVO : tiene
      ROL ||--o{ USUARIO_DISPOSITIVO : asigna
      TIPO_DISPOSITIVO ||--o{ DISPOSITIVO : clasifica
      PROFESIONAL ||--o{ PROFESIONAL_AREA : alcance_en
      AREA ||--o{ PROFESIONAL_AREA : otorga
      USUARIO ||--o{ AUDITORIA : genera
      DISPOSITIVO ||--o{ DISPOSITIVO_AREA : habilita
      AREA ||--o{ DISPOSITIVO_AREA : aplica_en

      PERSONA_ASISTIDA ||--o{ ESTADIA : registra
      DISPOSITIVO ||--o{ ESTADIA : aloja
      DISPOSITIVO ||--o{ PARTE_DIARIO : genera
      PARTE_DIARIO ||--o{ REGISTRO_PRESENCIA : contiene
      PERSONA_ASISTIDA ||--o{ REGISTRO_PRESENCIA : participa

      DISPOSITIVO_AREA ||--o{ TALLER : contexto_de
      TALLER ||--o{ INSCRIPCION_TALLER : recibe
      PERSONA_ASISTIDA ||--o{ INSCRIPCION_TALLER : se_inscribe
      TALLER ||--o{ TALLER_PROFESIONAL : dictado_por
      PROFESIONAL ||--o{ TALLER_PROFESIONAL : dicta
      TALLER ||--o{ SESION_TALLER : tiene
      SESION_TALLER ||--o{ ASISTENCIA_TALLER : registra
      PERSONA_ASISTIDA ||--o{ ASISTENCIA_TALLER : asiste

      PERSONA_ASISTIDA ||--o{ TRAYECTORIA : tiene
      PROFESIONAL ||--o{ TRAYECTORIA : interviene
      AREA ||--o{ TRAYECTORIA : clasifica_op
      DISPOSITIVO ||--o{ TRAYECTORIA : ocurre_en_op
      TIPO_INTERVENCION ||--o{ TRAYECTORIA : tipifica

      PERSONA_ASISTIDA ||--o| FICHA_EDUCACION : tiene
      PERSONA_ASISTIDA ||--o| FICHA_ASISTENCIA_SOCIAL : tiene
      PERSONA_ASISTIDA ||--o| FICHA_LABORAL : tiene
      FICHA_LABORAL ||--o{ EXPERIENCIA_LABORAL : registra
      FICHA_LABORAL ||--o{ CAPACITACION : registra
      PERSONA_ASISTIDA ||--o| FICHA_ECONOMICA : tiene
      FICHA_ECONOMICA ||--o{ MOVIMIENTO_ECONOMICO : registra
      PERSONA_ASISTIDA ||--o{ PROGRAMA_SOCIAL : participa
      PERSONA_ASISTIDA ||--o| FICHA_HABITACIONAL : tiene
      FICHA_HABITACIONAL ||--o{ HISTORIAL_HABITACIONAL : registra

      PERSONA_ASISTIDA ||--o| FICHA_SALUD : tiene
      FICHA_SALUD ||--o{ DIAGNOSTICO : registra
      FICHA_SALUD ||--o{ ANTECEDENTE_PATOLOGICO : registra
      FICHA_SALUD ||--o{ CIRUGIA : registra
      FICHA_SALUD ||--o{ INTERNACION : registra
      FICHA_SALUD ||--o{ PROFESIONAL_TRATANTE : registra
      FICHA_SALUD ||--o{ TURNO_SALUD : agenda
      PROFESIONAL_TRATANTE ||--o{ TURNO_SALUD : atiende_op
      USUARIO ||--o{ TURNO_SALUD : carga

      FICHA_SALUD ||--o{ PRESCRIPCION : indica
      PROFESIONAL_TRATANTE ||--o{ PRESCRIPCION : prescribe_op
      PRESCRIPCION ||--o{ ADMINISTRACION_MEDICACION : se_administra
      USUARIO ||--o{ ADMINISTRACION_MEDICACION : administra

      PERSONA_ASISTIDA ||--o{ VINCULO : tiene
      TIPO_VINCULO ||--o{ VINCULO : clasifica

      PERSONA_ASISTIDA ||--o{ ALERTA : genera
      TIPO_ALERTA ||--o{ ALERTA : tipifica
      AREA ||--o{ TIPO_ALERTA : asocia_op
      PROFESIONAL ||--o{ ALERTA : atiende_op
      TIPO_EVENTO_CRITICO ||--o{ EVENTO_CRITICO : tipifica
      NIVEL_GRAVEDAD ||--o{ EVENTO_CRITICO : clasifica
      PROFESIONAL ||--o{ EVENTO_CRITICO : reporta
      DISPOSITIVO ||--o{ EVENTO_CRITICO : ocurre_en_op
      EVENTO_CRITICO ||--o{ EVENTO_CRITICO_PERSONA : involucra
      PERSONA_ASISTIDA ||--o{ EVENTO_CRITICO_PERSONA : participa_en

      PERSONA_ASISTIDA ||--o| PVCP : tiene
      PVCP ||--o{ OBJETIVO_PVCP : contiene
      AREA ||--o{ OBJETIVO_PVCP : clasifica_op2
      OBJETIVO_PVCP ||--o{ ACCION_PVCP : define
      PROFESIONAL ||--o{ ACCION_PVCP : acompana
      OBJETIVO_PVCP ||--o{ SEGUIMIENTO_PVCP : evoluciona
      PROFESIONAL ||--o{ SEGUIMIENTO_PVCP : registra_pvcp

      AREA ||--o{ ASPECTO_EVALUACION : agrupa
      ASPECTO_EVALUACION ||--o{ EVALUACION_AUTONOMIA : evalua
      PERSONA_ASISTIDA ||--o{ EVALUACION_AUTONOMIA : tiene_eval
      NIVEL_AUTONOMIA ||--o{ EVALUACION_AUTONOMIA : clasifica_niv
      PROFESIONAL ||--o{ EVALUACION_AUTONOMIA : responsable

      PERSONA_ASISTIDA ||--o{ ARCHIVO_ADJUNTO : tiene
      USUARIO ||--o{ ARCHIVO_ADJUNTO : carga_arch
      ESTADIA ||--o{ INVENTARIO_BIEN : registra_bien

      PERSONA_ASISTIDA ||--o{ REGISTRO_CUALITATIVO : tiene
      PROFESIONAL ||--o{ REGISTRO_CUALITATIVO : redacta
    `;

    try {
      const { svg } = await mermaid.render('erd-svg', def);
      const container = document.getElementById('erd');
      container.innerHTML = svg;

      // Transformación de los nodos para bordes redondeados rx="8"
      document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
        const firstPath = node.querySelector('path[d]');
        if (!firstPath) return;
        const d = firstPath.getAttribute('d');
        const nums = d.match(/-?[\d.]+/g)?.map(Number);
        if (!nums || nums.length < 8) return;
        const xs = [nums[0], nums[2], nums[4], nums[6]];
        const ys = [nums[1], nums[3], nums[5], nums[7]];
        const x = Math.min(...xs), y = Math.min(...ys);
        const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
        const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        rect.setAttribute('x', x); rect.setAttribute('y', y);
        rect.setAttribute('width', w); rect.setAttribute('height', h);
        rect.setAttribute('rx', '8');
        for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
          if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
        }
        firstPath.replaceWith(rect);
      });

      document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
        p.setAttribute('stroke', 'none');
      });

      // Inicialización de Pan y Zoom
      const svgElement = container.querySelector('svg');
      if (svgElement) {
        svgElement.setAttribute('width', '100%');
        svgElement.setAttribute('height', '100%');
        svgPanZoom(svgElement, {
          zoomEnabled: true,
          controlIconsEnabled: true,
          maxZoom: 10,
          minZoom: 0.2,
          zoomScaleSensitivity: 0.3,
          mouseWheelZoomEnabled: true
        });
      }
    } catch (e) {
      document.getElementById('erd').innerHTML = `<p style="color:red; padding:10px;">Error al renderizar el esquema unificado: ${e.message}</p>`;
      console.error(e);
    }
  </script>
</body>
</html>
